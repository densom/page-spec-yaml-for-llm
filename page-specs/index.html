<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page-Spec Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface-alt: #0f3460;
      --primary: #e94560;
      --text: #eee;
      --text-muted: #aaa;
      --border: #333;
      --success: #4ade80;
      --warning: #fbbf24;
      --info: #60a5fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1rem;
      overflow-y: auto;
      max-height: 100vh;
      position: sticky;
      top: 0;
    }

    .sidebar h1 {
      font-size: 1.25rem;
      margin-bottom: 1.5rem;
      color: var(--primary);
    }

    .sidebar h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin: 1.5rem 0 0.5rem;
    }

    .file-list {
      list-style: none;
    }

    .file-list li {
      margin: 0.25rem 0;
    }

    .file-list a {
      display: block;
      padding: 0.5rem 0.75rem;
      color: var(--text);
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.875rem;
      transition: background 0.2s;
    }

    .file-list a:hover {
      background: var(--surface-alt);
    }

    .file-list a.active {
      background: var(--primary);
      color: white;
    }

    .main {
      padding: 2rem 3rem;
      max-width: 900px;
    }

    .welcome {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }

    .welcome h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--text);
    }

    /* Flow Styles */
    .flow-header {
      margin-bottom: 2rem;
    }

    .flow-header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .flow-header .goal {
      font-size: 1.125rem;
      color: var(--text-muted);
    }

    .flow-meta {
      display: flex;
      gap: 2rem;
      margin: 1.5rem 0;
      padding: 1rem;
      background: var(--surface);
      border-radius: 8px;
    }

    .flow-meta dt {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .flow-meta dd {
      font-weight: 500;
    }

    .preconditions {
      margin: 1.5rem 0;
      padding: 1rem;
      background: var(--surface);
      border-radius: 8px;
      border-left: 4px solid var(--warning);
    }

    .preconditions h3 {
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
    }

    .preconditions ul {
      margin-left: 1.25rem;
      color: var(--text-muted);
    }

    .steps {
      margin: 2rem 0;
    }

    .steps h2 {
      margin-bottom: 1rem;
    }

    .step {
      position: relative;
      padding: 1.5rem;
      padding-left: 4rem;
      background: var(--surface);
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .step-number {
      position: absolute;
      left: 1rem;
      top: 1.5rem;
      width: 2rem;
      height: 2rem;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.875rem;
    }

    .step-page {
      font-family: monospace;
      font-size: 0.875rem;
      color: var(--info);
      margin-bottom: 0.5rem;
    }

    .step-description {
      font-weight: 500;
      margin-bottom: 0.75rem;
    }

    .step-detail {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin: 0.25rem 0;
    }

    .step-detail strong {
      color: var(--text);
    }

    .decision {
      margin-top: 1rem;
      padding: 1rem;
      background: var(--surface-alt);
      border-radius: 4px;
    }

    .decision h4 {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--warning);
      margin-bottom: 0.5rem;
    }

    .branch {
      display: flex;
      gap: 1rem;
      font-size: 0.875rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .branch:last-child {
      border-bottom: none;
    }

    .branch-when {
      color: var(--info);
      min-width: 200px;
    }

    .branch-then {
      color: var(--success);
    }

    .outcome {
      margin: 2rem 0;
      padding: 1rem;
      background: var(--surface);
      border-radius: 8px;
      border-left: 4px solid var(--success);
    }

    .outcome h3 {
      font-size: 0.875rem;
      color: var(--success);
      margin-bottom: 0.5rem;
    }

    .alternate-flows, .error-flows {
      margin: 2rem 0;
    }

    .alternate-flows h2, .error-flows h2 {
      margin-bottom: 1rem;
    }

    .alt-flow, .error-flow {
      padding: 1rem;
      background: var(--surface);
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .alt-flow h3, .error-flow h3 {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }

    .alt-flow .trigger, .error-flow .trigger {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* Page Styles */
    .page-header {
      margin-bottom: 2rem;
    }

    .page-header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .page-header .purpose {
      font-size: 1.125rem;
      color: var(--text-muted);
    }

    .page-meta {
      display: flex;
      gap: 2rem;
      margin: 1.5rem 0;
      padding: 1rem;
      background: var(--surface);
      border-radius: 8px;
    }

    .page-meta dt {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .page-meta dd {
      font-family: monospace;
      color: var(--info);
    }

    .section {
      margin: 1.5rem 0;
      padding: 1rem;
      background: var(--surface);
      border-radius: 8px;
    }

    .section h3 {
      font-size: 0.875rem;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .component {
      padding: 0.5rem;
      margin: 0.5rem 0;
      border-left: 2px solid var(--border);
      padding-left: 1rem;
    }

    .component-type {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--info);
      font-weight: 500;
    }

    .component-label {
      font-weight: 500;
    }

    .component-details {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .modal {
      margin: 1rem 0;
      padding: 1rem;
      background: var(--surface-alt);
      border-radius: 4px;
    }

    .modal h4 {
      margin-bottom: 0.5rem;
    }

    .badge {
      display: inline-block;
      padding: 0.125rem 0.5rem;
      background: var(--surface-alt);
      border-radius: 4px;
      font-size: 0.75rem;
      margin-right: 0.5rem;
    }

    .badge.auth { background: var(--warning); color: #000; }
    .badge.public { background: var(--success); color: #000; }

    /* Layout Styles */
    .layout-info {
      margin: 1rem 0;
      padding: 1rem;
      background: var(--surface);
      border-radius: 8px;
      border-left: 4px solid var(--info);
    }

    .layout-info h3 {
      font-size: 0.875rem;
      color: var(--info);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .layout-info .layout-link {
      color: var(--info);
      text-decoration: none;
      cursor: pointer;
      border-bottom: 1px dashed var(--info);
    }

    .layout-info .layout-link:hover {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .layout-section {
      margin: 0.75rem 0;
      padding: 0.75rem;
      background: var(--surface-alt);
      border-radius: 4px;
    }

    .layout-section-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .layout-header {
      margin-bottom: 2rem;
    }

    .layout-header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .layout-header .description {
      font-size: 1.125rem;
      color: var(--text-muted);
    }

    .layout-meta {
      display: flex;
      gap: 2rem;
      margin: 1.5rem 0;
      padding: 1rem;
      background: var(--surface);
      border-radius: 8px;
    }

    .layout-meta dt {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .layout-meta dd {
      font-family: monospace;
      color: var(--info);
    }

    .wrapper-config {
      margin: 1rem 0;
      padding: 1rem;
      background: var(--surface);
      border-radius: 8px;
    }

    .wrapper-config h3 {
      font-size: 0.875rem;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 0.75rem;
    }

    .wrapper-props {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .wrapper-prop dt {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .wrapper-prop dd {
      font-weight: 500;
    }

    /* Links */
    .route-link {
      color: var(--info);
      text-decoration: none;
      cursor: pointer;
      border-bottom: 1px dashed var(--info);
      transition: all 0.2s;
    }

    .route-link:hover {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .step-page a {
      color: var(--info);
      text-decoration: none;
      border-bottom: 1px dashed var(--info);
    }

    .step-page a:hover {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Page-Spec Viewer</h1>

      <h2>Layouts</h2>
      <ul class="file-list" id="layouts-list"></ul>

      <h2>Flows</h2>
      <ul class="file-list" id="flows-list"></ul>

      <h2>Pages</h2>
      <ul class="file-list" id="pages-list"></ul>
    </aside>

    <main class="main" id="content">
      <div class="welcome">
        <h2>Page-Spec Viewer</h2>
        <p>Select a flow or page from the sidebar to view its specification.</p>
      </div>
    </main>
  </div>

  <script>
    // Dynamic route-to-page mapping (built from loaded page specs)
    const routeToPage = {};

    // Cache for loaded layout data
    const layoutCache = {};

    /**
     * Extract just the filename from a path (handles both / and \ separators)
     */
    function getFilename(path) {
      return path.split(/[/\\]/).pop();
    }

    /**
     * Discover files in a directory by parsing the server's directory listing HTML.
     * Works with most static file servers (serve, http-server, python -m http.server, etc.)
     */
    async function discoverFiles(folder, pattern) {
      try {
        const response = await fetch(`${folder}/`);
        if (!response.ok) return [];

        const html = await response.text();
        const files = [];

        // Parse links from directory listing HTML
        // Most servers generate <a href="filename">filename</a> links
        const linkRegex = /<a[^>]+href="([^"]+)"[^>]*>/gi;
        let match;

        while ((match = linkRegex.exec(html)) !== null) {
          let href = decodeURIComponent(match[1]);
          // Extract just the filename (handles paths like \layouts\file.yaml or layouts/file.yaml)
          const filename = getFilename(href);
          // Filter by pattern and exclude parent directory links and empty strings
          if (filename && filename.match(pattern) && !filename.startsWith('..')) {
            files.push(filename);
          }
        }

        return files.sort();
      } catch (err) {
        console.warn(`Could not discover files in ${folder}:`, err.message);
        return [];
      }
    }

    /**
     * Build route-to-page mapping by loading each page spec and extracting its route
     */
    async function buildRouteMap(pages) {
      const promises = pages.map(async (filename) => {
        try {
          const response = await fetch(`pages/${filename}`);
          if (!response.ok) return;
          const text = await response.text();
          const data = jsyaml.load(text);
          if (data.route) {
            routeToPage[data.route] = filename;
          }
        } catch (err) {
          // Ignore errors for individual files
        }
      });
      await Promise.all(promises);
    }

    async function loadLayoutData(layoutName) {
      if (layoutCache[layoutName]) {
        return layoutCache[layoutName];
      }
      try {
        const filename = `${layoutName}.layout.yaml`;
        const response = await fetch(`layouts/${filename}`);
        if (!response.ok) return null;
        const text = await response.text();
        const data = jsyaml.load(text);
        layoutCache[layoutName] = data;
        return data;
      } catch (err) {
        return null;
      }
    }

    function navigateToLayout(filename) {
      document.querySelectorAll('.file-list a').forEach(el => {
        el.classList.remove('active');
        if (el.textContent === filename.replace('.layout.yaml', '')) {
          el.classList.add('active');
        }
      });
      loadFile('layouts', filename);
    }

    function normalizeRoute(route) {
      // Remove query strings
      route = route.split('?')[0];
      // Normalize parameter patterns
      return route.replace(/\{[^}]+\}/g, '{id}');
    }

    function findPageForRoute(route) {
      // Direct match first
      if (routeToPage[route]) return routeToPage[route];

      // Normalize and try again
      const normalized = normalizeRoute(route);
      for (const [pattern, file] of Object.entries(routeToPage)) {
        if (normalizeRoute(pattern) === normalized) {
          return file;
        }
      }

      // Try partial matches (for routes with query params)
      const basePath = route.split('?')[0];
      for (const [pattern, file] of Object.entries(routeToPage)) {
        if (pattern === basePath) return file;
      }

      return null;
    }

    function makeRouteLink(route) {
      const pageFile = findPageForRoute(route);
      if (pageFile) {
        return `<a href="#" class="route-link" onclick="event.preventDefault(); navigateToPage('${pageFile}')">${route}</a>`;
      }
      return `<code>${route}</code>`;
    }

    function navigateToPage(filename) {
      document.querySelectorAll('.file-list a').forEach(el => {
        el.classList.remove('active');
        if (el.textContent === filename.replace('.ui.yaml', '')) {
          el.classList.add('active');
        }
      });
      loadFile('pages', filename);
    }

    function populateList(listId, files, folder) {
      const list = document.getElementById(listId);
      list.innerHTML = ''; // Clear existing items
      files.forEach(file => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '#';
        // Clean up display name: remove extensions and numeric prefixes
        a.textContent = file
          .replace(/\.(layout|flow|ui)\.yaml$/, '')
          .replace(/^\d+\.\d+-/, '');
        a.onclick = (e) => {
          e.preventDefault();
          document.querySelectorAll('.file-list a').forEach(el => el.classList.remove('active'));
          a.classList.add('active');
          loadFile(folder, file);
        };
        li.appendChild(a);
        list.appendChild(li);
      });
    }

    async function loadFile(folder, filename) {
      try {
        const response = await fetch(`${folder}/${filename}`);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        const text = await response.text();
        // Check if we got HTML instead of YAML (server error page)
        if (text.trim().startsWith('<!') || text.trim().startsWith('<html')) {
          throw new Error('Server returned HTML instead of YAML. Check if the file exists.');
        }
        const data = jsyaml.load(text);

        if (filename.endsWith('.layout.yaml')) {
          renderLayout(data);
        } else if (filename.endsWith('.flow.yaml')) {
          renderFlow(data);
        } else {
          await renderPage(data);
        }
      } catch (err) {
        document.getElementById('content').innerHTML = `
          <div class="welcome">
            <h2>Error Loading File</h2>
            <p><strong>File:</strong> <code>${folder}/${filename}</code></p>
            <p><strong>Error:</strong> ${err.message}</p>
            <p style="margin-top:1rem;font-size:0.875rem">
              Note: This viewer needs to be served via HTTP.<br>
              Run: <code>npx serve .</code> from the page-specs directory
            </p>
          </div>
        `;
      }
    }

    function renderFlow(data) {
      let html = `
        <div class="flow-header">
          <h1>${data.flow}</h1>
          <p class="goal">${data.goal}</p>
        </div>

        <dl class="flow-meta">
          <div>
            <dt>Actor</dt>
            <dd>${data.actor || 'Not specified'}</dd>
          </div>
        </dl>
      `;

      if (data.preconditions?.length) {
        html += `
          <div class="preconditions">
            <h3>Preconditions</h3>
            <ul>
              ${data.preconditions.map(p => `<li>${p}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      if (data.steps?.length) {
        html += `<div class="steps"><h2>Steps</h2>`;
        data.steps.forEach(step => {
          html += `
            <div class="step">
              <div class="step-number">${step.step}</div>
              <div class="step-page">${makeRouteLink(step.page)}</div>
              <div class="step-description">${step.description || ''}</div>
              ${step['user-action'] ? `<div class="step-detail"><strong>User:</strong> ${step['user-action']}</div>` : ''}
              ${step['system-response'] ? `<div class="step-detail"><strong>System:</strong> ${step['system-response']}</div>` : ''}
              ${step.notes ? `<div class="step-detail"><strong>Notes:</strong> ${step.notes}</div>` : ''}
              ${step.condition ? `<div class="step-detail"><strong>Condition:</strong> <code>${step.condition}</code></div>` : ''}
              ${renderDecision(step.decision)}
            </div>
          `;
        });
        html += `</div>`;
      }

      if (data.outcome) {
        html += `
          <div class="outcome">
            <h3>Outcome</h3>
            <p>${data.outcome}</p>
          </div>
        `;
      }

      if (data['alternate-flows']?.length) {
        html += `<div class="alternate-flows"><h2>Alternate Flows</h2>`;
        data['alternate-flows'].forEach(flow => {
          let stepsHtml = '';
          if (flow.steps?.length) {
            stepsHtml = '<div style="margin-top:0.75rem;margin-left:1rem;font-size:0.875rem">';
            flow.steps.forEach(step => {
              stepsHtml += `<div style="margin:0.25rem 0"><strong>${step.step}.</strong> ${makeRouteLink(step.page)} - ${step.description || ''}</div>`;
            });
            stepsHtml += '</div>';
          }
          html += `
            <div class="alt-flow">
              <h3>${flow.name}</h3>
              <p class="trigger"><strong>Trigger:</strong> ${flow.trigger}</p>
              ${stepsHtml}
              ${flow.rejoins ? `<p class="trigger"><strong>Rejoins:</strong> ${flow.rejoins}</p>` : ''}
            </div>
          `;
        });
        html += `</div>`;
      }

      if (data['error-flows']?.length) {
        html += `<div class="error-flows"><h2>Error Flows</h2>`;
        data['error-flows'].forEach(flow => {
          html += `
            <div class="error-flow">
              <h3>${flow.name}</h3>
              <p class="trigger"><strong>Trigger:</strong> ${flow.trigger}</p>
              <p class="trigger"><strong>Handling:</strong> ${flow.handling}</p>
              ${flow.recovery ? `<p class="trigger"><strong>Recovery:</strong> ${flow.recovery}</p>` : ''}
            </div>
          `;
        });
        html += `</div>`;
      }

      document.getElementById('content').innerHTML = html;
    }

    function renderDecision(decision) {
      if (!decision) return '';
      return `
        <div class="decision">
          <h4>Decision: ${decision.condition}</h4>
          ${decision.branches?.map(b => `
            <div class="branch">
              <span class="branch-when">${b.when}</span>
              <span class="branch-then">${b.then}</span>
            </div>
          `).join('') || ''}
        </div>
      `;
    }

    function renderLayout(data) {
      let html = `
        <div class="layout-header">
          <h1>${data.layout} Layout</h1>
          <p class="description">${data.description || ''}</p>
        </div>

        <dl class="layout-meta">
          <div>
            <dt>Layout ID</dt>
            <dd>${data.layout}</dd>
          </div>
        </dl>
      `;

      if (data.wrapper) {
        html += `
          <div class="wrapper-config">
            <h3>Content Wrapper</h3>
            <dl class="wrapper-props">
              <div class="wrapper-prop">
                <dt>Max Width</dt>
                <dd>${data.wrapper.maxWidth || 'default'}</dd>
              </div>
              <div class="wrapper-prop">
                <dt>Padding</dt>
                <dd>${data.wrapper.padding || 'default'}</dd>
              </div>
              <div class="wrapper-prop">
                <dt>Centered</dt>
                <dd>${data.wrapper.centered ? 'Yes' : 'No'}</dd>
              </div>
            </dl>
          </div>
        `;
      }

      if (data.header) {
        html += `
          <div class="section">
            <h3>Header</h3>
            ${renderComponents(data.header)}
          </div>
        `;
      }

      if (data.sidebar) {
        html += `
          <div class="section">
            <h3>Sidebar</h3>
            ${renderComponents(data.sidebar)}
          </div>
        `;
      }

      if (data.footer) {
        html += `
          <div class="section">
            <h3>Footer</h3>
            ${renderComponents(data.footer)}
          </div>
        `;
      }

      document.getElementById('content').innerHTML = html;
    }

    async function renderPage(data) {
      const authClass = data.auth === 'public' ? 'public' : 'auth';
      const layoutName = data.layout || 'default';
      const layoutData = await loadLayoutData(layoutName);

      let html = `
        <div class="page-header">
          <h1>${data.page}</h1>
          <p class="purpose">${data.purpose || ''}</p>
        </div>

        <dl class="page-meta">
          <div>
            <dt>Route</dt>
            <dd>${data.route}</dd>
          </div>
          <div>
            <dt>Auth</dt>
            <dd><span class="badge ${authClass}">${data.auth}</span></dd>
          </div>
          <div>
            <dt>Layout</dt>
            <dd>${layoutData
              ? `<a href="#" class="route-link" onclick="event.preventDefault(); navigateToLayout('${layoutName}.layout.yaml')">${layoutName}</a>`
              : layoutName
            }</dd>
          </div>
        </dl>
      `;

      // Show layout info if available
      if (layoutData) {
        html += `
          <div class="layout-info">
            <h3>
              Layout:
              <a href="#" class="layout-link" onclick="event.preventDefault(); navigateToLayout('${layoutName}.layout.yaml')">${layoutName}</a>
            </h3>
            <p style="font-size:0.875rem;color:var(--text-muted);margin-bottom:0.75rem">
              This page uses shared header/footer from the ${layoutName} layout.
            </p>
        `;

        if (layoutData.header) {
          html += `
            <div class="layout-section">
              <div class="layout-section-label">Header (from layout)</div>
              ${renderComponents(layoutData.header)}
            </div>
          `;
        }

        html += `</div>`;
      }

      if (data.sections) {
        data.sections.forEach(section => {
          const sectionName = Object.keys(section)[0];
          const components = section[sectionName];

          html += `
            <div class="section">
              <h3>${sectionName}</h3>
              ${renderComponents(components)}
            </div>
          `;
        });
      }

      // Show layout footer info if available
      if (layoutData && layoutData.footer) {
        html += `
          <div class="layout-info">
            <div class="layout-section">
              <div class="layout-section-label">Footer (from layout)</div>
              ${renderComponents(layoutData.footer)}
            </div>
          </div>
        `;
      }

      if (data.modals) {
        html += `<div class="section"><h3>Modals</h3>`;
        Object.entries(data.modals).forEach(([name, modal]) => {
          html += `
            <div class="modal">
              <h4>${modal.title || name}</h4>
              <p class="component-details">Size: ${modal.size || 'md'}</p>
            </div>
          `;
        });
        html += `</div>`;
      }

      if (data.flows) {
        html += `<div class="section"><h3>Navigation Flows</h3>`;
        Object.entries(data.flows).forEach(([name, flow]) => {
          html += `
            <div class="component">
              <span class="component-type">${name}</span>
              <div class="component-details">Trigger: ${flow.trigger} &rarr; ${makeRouteLink(flow.to)}</div>
            </div>
          `;
        });
        html += `</div>`;
      }

      document.getElementById('content').innerHTML = html;
    }

    function renderComponents(components, depth = 0) {
      if (!components) return '';
      if (typeof components === 'string') {
        return `<div class="component"><span class="component-type">${components}</span></div>`;
      }
      if (!Array.isArray(components)) return '';

      return components.map(comp => {
        if (typeof comp === 'string') {
          return `<div class="component"><span class="component-type">${comp}</span></div>`;
        }

        const type = comp.type || 'unknown';
        const label = comp.label || comp.value || comp.title || '';
        const details = [];

        if (comp.action) details.push(`action: ${makeRouteLink(comp.action)}`);
        if (comp.condition) details.push(`if: ${comp.condition}`);
        if (comp.source) details.push(`source: ${comp.source}`);
        if (comp.variant) details.push(`variant: ${comp.variant}`);

        let childHtml = '';
        if (comp.items) {
          childHtml = `<div style="margin-left:1rem">${renderComponents(comp.items, depth + 1)}</div>`;
        }
        if (comp.fields) {
          childHtml = `<div style="margin-left:1rem">${comp.fields.map(f =>
            `<div class="component"><span class="component-type">field</span> <span class="component-label">${f.name}</span> <span class="component-details">(${f.type}${f.required ? ', required' : ''})</span></div>`
          ).join('')}</div>`;
        }

        return `
          <div class="component">
            <span class="component-type">${type}</span>
            ${label ? `<span class="component-label">${label}</span>` : ''}
            ${details.length ? `<div class="component-details">${details.join(' | ')}</div>` : ''}
            ${childHtml}
          </div>
        `;
      }).join('');
    }

    // Initialize - discover files dynamically
    async function init() {
      try {
        // Discover all files in parallel
        const [layouts, flows, pages] = await Promise.all([
          discoverFiles('layouts', /\.layout\.yaml$/),
          discoverFiles('flows', /\.flow\.yaml$/),
          discoverFiles('pages', /\.ui\.yaml$/)
        ]);

        // Build route map from discovered pages
        await buildRouteMap(pages);

        // Populate sidebar lists
        populateList('layouts-list', layouts, 'layouts');
        populateList('flows-list', flows, 'flows');
        populateList('pages-list', pages, 'pages');

        // Show count in welcome message
        document.getElementById('content').innerHTML = `
          <div class="welcome">
            <h2>Page-Spec Viewer</h2>
            <p>Select a layout, flow, or page from the sidebar to view its specification.</p>
            <p style="margin-top:1rem;font-size:0.875rem;color:var(--text-muted)">
              Discovered ${layouts.length} layouts, ${flows.length} flows, and ${pages.length} pages.
            </p>
          </div>
        `;
      } catch (err) {
        document.getElementById('content').innerHTML = `
          <div class="welcome">
            <h2>Error Loading Specs</h2>
            <p>${err.message}</p>
            <p style="margin-top:1rem;font-size:0.875rem">
              Note: This viewer needs to be served via HTTP with directory listing enabled.<br>
              Run: <code>npx serve .</code> from the page-specs directory
            </p>
          </div>
        `;
      }
    }

    init();
  </script>
</body>
</html>
